name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Setup Installer (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter doctor -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Build Flutter Windows Application (Obfuscated Release)
        shell: pwsh
        run: |
          if (Test-Path "build\symbols\windows") { Remove-Item -Recurse -Force "build\symbols\windows" }
          flutter build windows --release --obfuscate --split-debug-info=build/symbols/windows
          # Xóa các tệp debug .pdb nếu có trong thư mục Release để không đóng gói vào bộ cài .exe
          Get-ChildItem -Path "build\windows\x64\runner\Release" -Filter "*.pdb" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Bundle & Verify Visual C++ Runtime DLLs
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $crtDlls = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "concrt140.dll"
          )

          # Tìm thư mục Redist CRT chính thức từ Visual Studio (x64)
          $searchDirs = @()
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath
            if ($vsPath) {
              $crtDirs = Get-ChildItem -Path (Join-Path $vsPath "VC\Redist\MSVC") -Directory -Recurse -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -notmatch "\\onecore\\" } |
                Sort-Object FullName -Descending
              foreach ($d in $crtDirs) { $searchDirs += $d.FullName }
            }
          }
          $searchDirs += "$env:SystemRoot\System32"

          foreach ($dll in $crtDlls) {
            $dest = Join-Path $releaseDir $dll
            if (!(Test-Path $dest)) {
              foreach ($srcDir in $searchDirs) {
                $candidate = Join-Path $srcDir $dll
                if (Test-Path $candidate) {
                  Copy-Item -Path $candidate -Destination $dest -Force
                  Write-Host "Copied $dll from $srcDir"
                  break
                }
              }
            }
          }

          # Bắt buộc phải có đủ 3 DLL cốt lõi trước khi đóng gói Inno Setup
          $mandatory = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($req in $mandatory) {
            $p = Join-Path $releaseDir $req
            if (!(Test-Path $p)) {
              throw "Missing required Visual C++ runtime DLL in Release bundle: $req"
            }
          }

          Write-Host "Verified bundled Visual C++ Runtime DLLs in ${releaseDir}:"
          Get-ChildItem -Path $releaseDir -Filter "*140*.dll" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $distDir = "dist-flutter"
          if (!(Test-Path $distDir)) { New-Item -ItemType Directory -Path $distDir -Force }

          $isccCandidates = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source),
            "C:\ProgramData\chocolatey\bin\iscc.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if ($iscc) {
            Write-Host "Compiling setup installer with: $iscc"
            & "$iscc" "scripts\installer_windows.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
            }
            Write-Host "Setup installer created at dist-flutter\MXH-Tu-Dong-Setup-x64.exe"
          } else {
            throw "Inno Setup compiler (ISCC.exe) not found! Cannot build setup exe."
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MXH-Tu-Dong-Windows-Installer
          path: |
            dist-flutter/MXH-Tu-Dong-Setup-x64.exe
          retention-days: 14

      - name: Publish Windows Installer to GitHub Releases
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exePath = "dist-flutter/MXH-Tu-Dong-Setup-x64.exe"
          if (!(Test-Path $exePath)) {
            Write-Host "Installer not found at $exePath"
            exit 0
          }
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $runNum = "${{ github.run_number }}"
          $shaShort = "${{ github.sha }}".Substring(0, 7)
          $tag = if ($refType -eq "tag") { $refName } else { "v1.0.$runNum" }
          $title = "Diễn viên MXH - Windows Setup ($tag - $shaShort)"
          $notes = "Bản cài đặt Windows tự động đóng gói từ commit ${{ github.sha }} (nhánh/tag: $refName)."

          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exePath --clobber
          } else {
            gh release create $tag $exePath --title "$title" --notes "$notes" --latest
          }
